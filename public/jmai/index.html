<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMAI 静态页面</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #fff;
      --ink: #1d2430;
      --muted: #657181;
      --line: #dde3ea;
      --orange: #f47a00;
      --blue: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(244, 122, 0, .12), transparent 26rem),
        radial-gradient(circle at 84% 24%, rgba(37, 99, 235, .10), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .brand img {
      height: 42px;
      width: auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .lead {
      max-width: 680px;
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    a.card {
      display: block;
      min-height: 172px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 18px 48px rgba(22, 32, 48, .08);
      text-decoration: none;
      color: inherit;
    }

    .card strong {
      display: block;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .card span {
      color: var(--muted);
    }

    .path {
      margin-top: 22px;
      color: var(--blue);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: .9rem;
    }

    @media (max-width: 720px) {
      main { padding: 40px 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="assets/newlogo-4.png" alt="JIUMI">
    </div>
    <h1>JMAI 静态页面</h1>
    <p class="lead">JMAI 相关估算页、客户提交页和原型页统一放在这里维护，避免散落在其他工程或生产服务器。</p>
    <div class="grid">
      <a class="card" href="cost.html">
        <strong>成本估算 / 服务方案</strong>
        <span>九米AI × Amazon SP-API 服务与成本估算视觉页。</span>
        <div class="path">/jmai/cost.html</div>
      </a>
      <a class="card" href="prototype.html">
        <strong>Amazon 工作台原型</strong>
        <span>九米AI Amazon 合规经营工作台原型页。</span>
        <div class="path">/jmai/prototype.html</div>
      </a>
    </div>
  </main>
</body>
</html>
